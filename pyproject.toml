[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopcb"
version = "1.0.0.dev0"
description = "Local KiCad design, routing and verification tools"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
desktop = ["PySide6>=6.6,<7"]
desktop-build = ["PySide6>=6.6,<7", "PyInstaller>=6.11,<7"]
benchmark = ["psutil>=5.9"]
review = ["Pillow", "pypdfium2", "markdown-it-py"]

[project.scripts]
autopcb = "autopcb.cli:main"

[project.gui-scripts]
autopcb-desktop = "autopcb.cli:desktop_main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["autopcb*", "core*", "pcb*", "sch*", "review*", "release*", "verification*", "utils*"]

[tool.setuptools.package-data]
autopcb = ["catalog.json", "serve.html"]
