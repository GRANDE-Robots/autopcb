name: AutoPCB
options:
  bundleIdPrefix: com.grande
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AutoPCB:
    type: application
    platform: iOS
    sources:
      - Sources
      - Core
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grande.autopcb
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  AutoPCBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grande.autopcb.tests
        GENERATE_INFOPLIST_FILE: YES
  AutoPCBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AutoPCB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grande.autopcb.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AutoPCB:
    build:
      targets:
        AutoPCB: all
        AutoPCBTests: [test]
        AutoPCBUITests: [test]
    test:
      targets:
        - AutoPCBTests
        - AutoPCBUITests
