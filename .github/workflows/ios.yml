name: iOS

on:
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        run: |
          if ls /Applications/Xcode_16.app >/dev/null 2>&1; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd apps/ios && xcodegen generate
      - name: Test
        run: |
          cd apps/ios
          xcrun simctl list devices available
          device=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/^ +(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "Using simulator: $device"
          xcodebuild test -project AutoPCB.xcodeproj -scheme AutoPCB \
            -destination "platform=iOS Simulator,name=$device"
