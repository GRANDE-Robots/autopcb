name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    uses: ./.github/workflows/installers.yml

  android:
    uses: ./.github/workflows/android.yml

  publish:
    needs: [installers, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mkdir release
          cp artifacts/*.exe artifacts/*.deb artifacts/*.dmg release/
          cp artifacts/app-debug.apk "release/AutoPCB-$version-android-debug.apk"
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
          gh release create "v$version" release/* --draft --target "$GITHUB_SHA" \
            --title "AutoPCB $version" --notes-file packaging/release-notes.md
